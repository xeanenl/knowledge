<h1>Nước Ao Bị Đục</h1>

<h2>Dấu hiệu</h2>
<ul>
<li>Màu nước xám hoặc nâu.</li>
<li>Tầm nhìn thấp.</li>
</ul>

<h2>Nguyên nhân</h2>
<ul>
<li>Mưa lớn.</li>
<li>Đất đáy bị khuấy lên.</li>
<li>Vi sinh mất cân bằng.</li>
</ul>

<h2>Cách xử lý</h2>
<ol>
<li>Kiểm tra môi trường.</li>
<li>Tăng quạt nước.</li>
<li>Bổ sung vi sinh.</li>
</ol>

<h2>Từ khóa</h2>
<p>nước đục, màu nước</p>
