<h2>Mô tả</h2>
<p>Tôm nổi đầu thường liên quan đến thiếu oxy hoặc môi trường bất ổn.</p>

<h2>Nguyên nhân</h2>
<ul>
<li>DO thấp.</li>
<li>Tảo tàn.</li>
<li>Khí độc tăng cao.</li>
</ul>

<h2>Cách xử lý</h2>
<ol>
<li>Tăng quạt nước.</li>
<li>Bổ sung oxy.</li>
<li>Kiểm tra NH3 và NO2.</li>
</ol>

<h2>Từ khóa</h2>
<p>nổi đầu, thiếu oxy, DO thấp</p>
